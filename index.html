<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixels</title>
<link rel="stylesheet" href="css/styles.css">
<script
  src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"
  integrity="sha384-brfu63ZHzOfumoqQXzA4Wo7k9kQOaJ68C/E7+Uc8lgQB42dOOjA+urOyy/sOnKPq"
  crossorigin="anonymous"></script>
<script type="module" src="platform/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1 id="title"></h1>
      <p id="tagline"></p>
    </div>
  </div>
  <button id="detonate" type="button"></button>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="tag live">live</span>
      <span class="name">preview</span>
      <span class="meta" id="stage-meta"></span>
    </div>
    <div class="stage" id="stage">
      <p id="error" hidden></p>
    </div>
    <p class="legend" id="stage-legend"></p>
  </section>

  <section class="panel" id="sheet-panel" hidden>
    <div class="panel-head">
      <span class="tag">sheet</span>
      <span class="name" id="sheet-name"></span>
      <span class="meta" id="sheet-meta"></span>
    </div>
    <div class="ref">
      <canvas id="sheet-canvas" width="160" height="100"
        aria-label="The reference sheet played back a frame at a time, restarted by every run"></canvas>
    </div>
    <div class="swatches" id="swatches"></div>
    <p class="legend" id="sheet-legend"></p>
  </section>

  <section class="panel wide">
    <div class="panel-head">
      <span class="tag">stats</span>
      <span class="name">performance</span>
      <span class="meta">read four times a second</span>
      <div class="modes" id="modes" role="group" aria-label="Where each frame is drawn"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stats" id="stats-env"></div>
    <p class="legend" id="mode-note"></p>
  </section>

  <section class="panel wide">
    <details class="controls" id="controls">
      <summary class="panel-head">
        <span class="chev" aria-hidden="true">&#9656;</span>
        <span class="tag">knobs</span>
        <span class="name">controls</span>
        <span class="meta" id="controls-meta"></span>
      </summary>
      <div class="control-body">
        <div class="control-groups" id="control-groups"></div>
        <div class="control-foot">
          <button id="reset-params" type="button">Reset to defaults</button>
          <span id="control-note"></span>
        </div>
      </div>
    </details>
  </section>

  <section class="panel wide" id="ref-panel" hidden>
    <div class="panel-head">
      <span class="tag">source</span>
      <span class="name" id="ref-name"></span>
      <span class="meta" id="ref-meta"></span>
    </div>
    <div class="sheet">
      <div class="sheet-grid">
        <img id="sheet-img" alt="">
      </div>
    </div>
    <p class="legend" id="ref-legend"></p>
  </section>

  <section class="panel wide">
    <div class="panel-head">
      <span class="tag">files</span>
      <span class="name" id="explorer-root"></span>
      <span class="meta" id="viewer-meta"></span>
    </div>
    <div class="explorer">
      <nav class="filelist" id="filelist" role="tablist" aria-label="The files this animation is made of"></nav>
      <div class="viewer" id="viewer">
        <pre class="code" id="code-view"></pre>
        <article class="md" id="readme-view" hidden></article>
        <figure class="imgview" id="image-view" hidden>
          <img id="image-view-img" alt="">
          <figcaption id="image-view-caption"></figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>
</body>
</html>
