<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixels</title>

<!-- The share image and the icons are real frames of the animation, written by
     `node tools/poster.mjs` and committed. Nothing here is reference material. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/icon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<meta name="description" content="A procedural pixel-art explosion, drawn twice over: once in JavaScript a pixel at a time, once in fragment shaders. 160 × 100 pixels, eight colours, everything generated at runtime.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pixels.handgemacht.ai/">
<meta property="og:title" content="Procedural pixel-art explosion">
<meta property="og:description" content="A procedural pixel-art explosion, drawn twice over: once in JavaScript a pixel at a time, once in fragment shaders. 160 × 100 pixels, eight colours, everything generated at runtime.">
<meta property="og:image" content="https://pixels.handgemacht.ai/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A frame of the animation itself: a chunky pixel-art fireball with a shadowed hollow, in eight colours.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Procedural pixel-art explosion">
<meta name="twitter:description" content="Drawn twice over: once in JavaScript a pixel at a time, once in fragment shaders.">
<meta name="twitter:image" content="https://pixels.handgemacht.ai/assets/og.png">

<link rel="stylesheet" href="css/styles.css">
<script
  src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"
  integrity="sha384-brfu63ZHzOfumoqQXzA4Wo7k9kQOaJ68C/E7+Uc8lgQB42dOOjA+urOyy/sOnKPq"
  crossorigin="anonymous"></script>
<script type="module" src="platform/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1 id="title"></h1>
      <p id="tagline"></p>
    </div>
  </div>
  <a id="film-link" class="film-link" hidden target="_blank" rel="noopener"></a>
  <button id="detonate" type="button"></button>
</header>

<div class="page">
<aside class="rail">
  <section class="panel">
    <div class="panel-head">
      <span class="tag">index</span>
      <span class="name">animations</span>
      <span class="meta" id="switcher-meta"></span>
    </div>
    <nav class="switcher" id="switcher" aria-label="The animations this site can show"></nav>
  </section>
</aside>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="tag live">live</span>
      <span class="name">preview</span>
      <span class="meta" id="stage-meta"></span>
    </div>
    <div class="stage" id="stage">
      <p id="error" hidden></p>
    </div>
    <p class="legend" id="stage-legend"></p>
  </section>

  <section class="panel" id="sheet-panel" hidden>
    <div class="panel-head">
      <span class="tag">sheet</span>
      <span class="name" id="sheet-name"></span>
      <span class="meta" id="sheet-meta"></span>
    </div>
    <div class="ref">
      <canvas id="sheet-canvas" width="160" height="100"
        aria-label="The reference sheet played back a frame at a time, restarted by every run"></canvas>
    </div>
    <div class="swatches" id="swatches"></div>
    <p class="legend" id="sheet-legend"></p>
  </section>

  <section class="panel wide">
    <div class="panel-head">
      <span class="tag">stats</span>
      <span class="name">performance</span>
      <span class="meta">read four times a second</span>
      <div class="modes" id="modes" role="group" aria-label="Where each frame is drawn"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stats" id="stats-env"></div>
    <p class="legend" id="mode-note"></p>
  </section>

  <section class="panel wide">
    <details class="controls" id="controls">
      <summary class="panel-head">
        <span class="chev" aria-hidden="true">&#9656;</span>
        <span class="tag">knobs</span>
        <span class="name">controls</span>
        <span class="meta" id="controls-meta"></span>
      </summary>
      <div class="control-body">
        <div class="control-groups" id="control-groups"></div>
        <div class="control-foot">
          <button id="reset-params" type="button">Reset to defaults</button>
          <span id="control-note"></span>
        </div>
      </div>
    </details>
  </section>

  <section class="panel wide" id="ref-panel" hidden>
    <div class="panel-head">
      <span class="tag">source</span>
      <span class="name" id="ref-name"></span>
      <span class="meta" id="ref-meta"></span>
    </div>
    <div class="sheet">
      <div class="sheet-grid">
        <img id="sheet-img" alt="">
      </div>
    </div>
    <p class="legend" id="ref-legend"></p>
  </section>

  <section class="panel wide">
    <div class="panel-head">
      <span class="tag">files</span>
      <span class="name" id="explorer-root"></span>
      <span class="meta" id="viewer-meta"></span>
    </div>
    <div class="explorer">
      <nav class="filelist" id="filelist" role="tablist" aria-label="The files this animation is made of"></nav>
      <div class="viewer" id="viewer">
        <pre class="code" id="code-view"></pre>
        <article class="md" id="readme-view" hidden></article>
        <figure class="imgview" id="image-view" hidden>
          <img id="image-view-img" alt="">
          <figcaption id="image-view-caption"></figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>
</div>
</body>
</html>
